version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wardrobe_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wardrobe_db
      MYSQL_USER: wardrobe_user
      MYSQL_PASSWORD: wardrobe_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wardrobe_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql://wardrobe_user:wardrobe_password@mysql:3306/wardrobe_db
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wardrobe_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
